[project]
name = "timetable"
version = "1.0.0"
description = "시간표 앱 (Android)"
requires-python = ">=3.12"
# R3: 검증된 버전으로 고정
dependencies = [
  "flet==1.0.0",
  "pillow==12.2.0",  # R2: pypi.flet.dev의 Android 휠이 12.2.0까지만 제공됨
  "qrcode>=8.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.flet]
org = "com.seonho"
product = "대학 시간표"
company = "seonho"

[tool.flet.deep_linking]
scheme = "timetable"
host = "import"

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.2"

[tool.flet.app]
path = "."
# 앱 실행에 필요 없는 개발 파일과 산출물은 APK에 넣지 않는다
exclude = [
  ".git", ".venv", ".flet", ".data", ".pytest_cache", ".claude", ".specify", ".idea",
  "build", "tests", "scripts",
  "timetable_spec.md", "DESIGN.md",
  "assets/Timetable_icon.png",
  "*.jks", "*.keystore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
